# Railway deploy config for ma-creations-api (service Root Directory = this folder).
# Ensures the process binds Railway's injected PORT and health-checks /api/health.

[build]
builder = "NIXPACKS"
buildCommand = "mvn -DskipTests package"

[deploy]
startCommand = "java -Dserver.port=$PORT -jar target/ma-creations-api-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
