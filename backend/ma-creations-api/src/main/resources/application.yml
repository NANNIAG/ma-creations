spring:
  application:
    name: ma-creations-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ma_creations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  # Railway injects PORT; keep SERVER_PORT for local overrides.
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads/products}
    public-base-path: ${UPLOAD_PUBLIC_BASE_PATH:/api/media}
  security:
    jwt:
      # REQUIRED in real environments via JWT_SECRET — must be >= 32 chars
      secret: ${JWT_SECRET:dev-only-change-me-ma-creations-jwt-secret-key}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    customer:
      jwt:
        # REQUIRED in real environments via CUSTOMER_JWT_SECRET — must differ from admin JWT_SECRET
        secret: ${CUSTOMER_JWT_SECRET:dev-only-change-me-ma-creations-customer-jwt-key}
        expiration-ms: ${CUSTOMER_JWT_EXPIRATION_MS:86400000}
      otp:
        expiry-minutes: ${CUSTOMER_OTP_EXPIRY_MINUTES:5}
        max-attempts: ${CUSTOMER_OTP_MAX_ATTEMPTS:5}
        # Local/tests only — never set a fixed OTP in production
        dev-fixed-otp: ${CUSTOMER_OTP_DEV_FIXED:}
        # Local only — logs OTP to server logs when true
        dev-log-otp: ${CUSTOMER_OTP_DEV_LOG:false}
    admin-bootstrap:
      # Optional: create first admin when admin_user table is empty
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  checkout:
    pricing-version: ${CHECKOUT_PRICING_VERSION:v1}
    # Used to HMAC-bind checkout preview (override in every real environment)
    preview-secret: ${CHECKOUT_PREVIEW_SECRET:dev-only-checkout-preview-secret-key}
    shipping:
      # V1 client rule: flat ₹20 shipping (FIXED). Modes: PENDING | ZERO | FIXED
      mode: ${CHECKOUT_SHIPPING_MODE:FIXED}
      fixed-amount: ${CHECKOUT_SHIPPING_FIXED_AMOUNT:20.00}
    tax:
      # V1 client rule: GST is not charged (prices are GST-inclusive). Keep ZERO — do not invent a GST %.
      mode: ${CHECKOUT_TAX_MODE:ZERO}
      fixed-amount: ${CHECKOUT_TAX_FIXED_AMOUNT:0}
    cod:
      # V1 client rule: ₹20 COD fee when paymentMethod=COD (FIXED). Modes: PENDING | ZERO | FIXED
      mode: ${CHECKOUT_COD_MODE:FIXED}
      fixed-amount: ${CHECKOUT_COD_FIXED_AMOUNT:20.00}
  payment:
    # Selected primary online gateway (Step 23). COD does not use this provider.
    provider: ${PAYMENT_PROVIDER:RAZORPAY}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      # Enable only after Razorpay dashboard Pay Later / BNPL is configured for the merchant.
      # Do not invent a BNPL provider name in code.
      pay-later-enabled: ${RAZORPAY_PAY_LATER_ENABLED:false}

logging:
  level:
    root: INFO
    com.macreations: DEBUG
